<h2>Gestión de tarifas</h2>

@if (mensaje()) { <div class="chip chip-Libre" style="padding:10px 16px">{{ mensaje() }}</div> }
@if (error()) { <div class="admin-error">{{ error() }}</div> }

@if (cargando()) {
  <p style="color:var(--text-muted)">Cargando tarifas...</p>
} @else {
  <div class="admin-caja" style="max-width:460px;padding:28px">
    <p class="sub" style="text-align:left;margin-bottom:16px">
      Configure el precio por noche para cada tipo de habitación (conectado en vivo a la base de datos).
    </p>
    @for (t of tarifas(); track t.tipo) {
      <div class="campo-form">
        <label>Habitación {{ t.tipo }} (S/ por noche · actual S/ {{ t.precioActual }})</label>
        <input type="number" min="0" step="1" [(ngModel)]="t.nuevoPrecio">
      </div>
    }
    <button class="btn btn-primario" (click)="guardarTodo()" [disabled]="guardando()">
      {{ guardando() ? 'Guardando...' : 'Guardar tarifas' }}
    </button>
  </div>
}
