@if (logueado) {
  <div class="admin-shell">
    <aside>
      <div class="titulo">
        <span><b>Hotel Támpur</b><small>Backoffice Angular</small></span>
      </div>
      <a routerLink="/reservas" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
        <span>Monitorear reservas</span>
      </a>
      <a routerLink="/calendario" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><rect x="7" y="14" width="3" height="3" rx=".5"/><rect x="14" y="14" width="3" height="3" rx=".5"/></svg>
        <span>Calendario</span>
      </a>
      <a routerLink="/dashboard" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21V7a2 2 0 012-2h14a2 2 0 012 2v14"/><path d="M3 11h18"/><path d="M9 21V11"/><circle cx="7" cy="16" r="1" fill="currentColor"/><rect x="13" y="14" width="5" height="3" rx=".5"/></svg>
        <span>Plano y Caja (KPIs)</span>
      </a>
      <a routerLink="/limpieza" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><path d="M18 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" opacity=".6"/></svg>
        <span>Limpieza del día</span>
      </a>
      <a routerLink="/precios" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="9" r="7"/><path d="M14.5 14.5L20 20"/><path d="M9 6v6M7 9h4"/></svg>
        <span>Gestión de tarifas</span>
      </a>
      <a routerLink="/huespedes" routerLinkActive="activo">
        <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Directorio huéspedes</span>
      </a>
      <a href="/" class="salir" style="margin-top:auto">← Volver a la web</a>
      <button class="salir" style="margin-top:4px" (click)="salir()">↩ Cerrar sesión</button>
    </aside>
    <main>
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
