spring.application.name=pagos-service
server.port=8082

# PostgreSQL (Supabase) - Variables de entorno:
#   $env:SUPABASE_DB_URL="jdbc:postgresql://..."
#   $env:SUPABASE_DB_USER="postgres.xxx"
#   $env:SUPABASE_DB_PASSWORD="tu-password"
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/hoteltampur}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always

# Pool de conexiones reducido: Supabase (session pooler) limita a 15 clientes.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Correo transaccional (SendGrid). API key por variable de entorno:
#   $env:SENDGRID_API_KEY="SG.xxx"
