name: keepalive

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar tampur-monolito
        run: |
          curl -sS -o /dev/null -m 60 https://tampur-monolito.onrender.com/api/habitaciones || true
          sleep 10
          curl -sS -o /dev/null -m 60 https://tampur-monolito.onrender.com/api/habitaciones || true
